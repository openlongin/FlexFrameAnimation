[versions]
agp = "8.0.0"
appcontext = "2.2.4"
kotlin = "1.6.10"
coreKtx = "1.7.0"
junit = "4.13.2"
junitVersion = "1.1.3"
espressoCore = "3.4.0"
appcompat = "1.4.1"
kotlinxCoroutinesCore = "1.5.1"
kotlinxCoroutinesAndroid = "1.5.0"
material = "1.6.1"
constraintlayout = "2.1.4"
fragmentKtx = "1.5.4"
flexbox = "3.0.0"
mockk = "1.12.0"
guava = "33.2.0-android"
ffaPlayer = "4.0.0"
robolectric = "4.7.3"
vanniktech = "0.29.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcontext = { module = "io.github.idonans.appcontext:appcontext", version.ref = "appcontext" }
ffa-player = { module = "io.github.openlongin.ffa.player:player", version.ref = "ffaPlayer" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
flexbox = { group = "com.google.android.flexbox", name = "flexbox", version.ref = "flexbox" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
